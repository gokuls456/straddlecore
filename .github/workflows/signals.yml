name: Strategy signals

# Telegram alerts (strategies listed in signals_config.json), Mon–Fri. No orders are placed.
# GitHub's cron starts runs hours late or skips them, so the runs form a chain instead: every
# run either scans (morning until 12:15, afternoon until 15:40) or sleeps until the next
# session (at most 5h15m), then starts the next run itself. The crons below only restart the
# chain if it ever breaks. Concurrency keeps one run active plus at most one waiting, so extra
# starts can't pile up. To stop everything: Actions → Strategy signals → ⋯ → Disable workflow.
# Cron times are UTC (IST = UTC + 5:30).
on:
  schedule:
    - cron: "20 3 * * 1-5"   # 8:50 AM IST  chain restarts (only matter if the chain broke)
    - cron: "35 3 * * 1-5"   # 9:05 AM IST
    - cron: "50 3 * * 1-5"   # 9:20 AM IST
    - cron: "30 6 * * 1-5"   # 12:00 PM IST
    - cron: "0 13 * * *"     # 6:30 PM IST, daily, so the chain is back before the next morning
  workflow_dispatch:
    inputs:
      until:
        description: "Stop at (IST, HH:MM). Leave empty for automatic"
        default: ""
      test:
        description: "Only send one test alert to Telegram"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # to start the next run in the chain

concurrency:
  group: ${{ inputs.test && 'signals-test' || 'signals' }}   # test alerts don't wait behind the chain
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-signals.txt
      - run: pip install -r requirements-signals.txt
      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Dhan: market data for the scanner (Data API plan). PIN + TOTP log in automatically
          # every day; DHAN_ACCESS_TOKEN is only needed if you don't use PIN + TOTP.
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          TZ: Asia/Kolkata
        run: |
          git config user.name "signals-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ inputs.test }}" = "true" ]; then
            python github_signals.py --test
            exit 0
          fi
          if [ -n "${{ inputs.until }}" ]; then
            python github_signals.py --until "${{ inputs.until }}"
          else
            python github_signals.py --auto
          fi
      - name: Start the next run
        if: always() && inputs.test != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do
            gh workflow run signals.yml --repo "${{ github.repository }}" --ref main && exit 0
            sleep 30
          done
          exit 1
