name: Strategy signals

# Telegram alerts for all strategies, Mon–Fri. No orders are placed.
# GitHub jobs are limited to 6 hours, so the market day is split into two runs.
# Cron times are UTC (IST = UTC + 5:30). GitHub can start scheduled runs late or skip
# them, so each half of the day has backup start times. Only one run is active at a time
# (concurrency below); a duplicate that starts after its window simply exits.
on:
  schedule:
    - cron: "20 3 * * 1-5"   # 8:50 AM IST  morning run (until 12:15 PM)
    - cron: "35 3 * * 1-5"   # 9:05 AM IST  backup
    - cron: "50 3 * * 1-5"   # 9:20 AM IST  backup
    - cron: "5 4 * * 1-5"    # 9:35 AM IST  backup
    - cron: "30 6 * * 1-5"   # 12:00 PM IST afternoon run (until 3:40 PM), queued behind the morning run
    - cron: "45 6 * * 1-5"   # 12:15 PM IST backup
    - cron: "0 7 * * 1-5"    # 12:30 PM IST backup
  workflow_dispatch:
    inputs:
      until:
        description: "Stop at (IST, HH:MM)"
        default: "15:40"
      test:
        description: "Only send one test alert to Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-signals.txt
      - run: pip install -r requirements-signals.txt
      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INDSTOCKS_CLIENT_ID: ${{ secrets.INDSTOCKS_CLIENT_ID }}
          INDSTOCKS_MPIN: ${{ secrets.INDSTOCKS_MPIN }}
          INDSTOCKS_TOTP_SECRET: ${{ secrets.INDSTOCKS_TOTP_SECRET }}
          INDSTOCKS_ACCESS_TOKEN: ${{ secrets.INDSTOCKS_ACCESS_TOKEN }}
          GROWW_API_KEY: ${{ secrets.GROWW_API_KEY }}
          GROWW_API_SECRET: ${{ secrets.GROWW_API_SECRET }}
          GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}
          TZ: Asia/Kolkata
        run: |
          git config user.name "signals-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ inputs.test }}" = "true" ]; then
            python github_signals.py --test
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            UNTIL="${{ inputs.until }}"
          elif [ "$(date +%H%M)" -lt 1200 ]; then
            UNTIL="12:15"   # morning run (TZ is Asia/Kolkata)
          else
            UNTIL="15:40"
          fi
          python github_signals.py --until "$UNTIL"
